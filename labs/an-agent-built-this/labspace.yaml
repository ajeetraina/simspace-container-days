title: "Contain"
description: >
  Run the AI coding agent inside an sbx microVM, with its credentials injected
  from outside the box so the raw keys never enter the sandbox. Then try the
  escape an ungoverned agent would use - and watch it stay contained. Fully
  simulated; nothing to install; every learner sees the same result.

# Landing-page card. Only shown when the repo has two or more labs. labs.json is
# GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: deployed_code
  description: "Run the agent inside an sbx microVM with credentials injected from outside the box - then try the escape and watch it stay contained."
  tags:
    ["sandbox", "sbx", "microvm", "isolation", "credentials", "contain"]
  estimatedMinutes: 25
  order: 2

simulator: simulator.yaml

terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed a project the agent will work on. There's nothing host-sensitive here -
# the point of the lab is that the host's secrets and engine never enter the box.
files:
  README.md: |
    # Contain - lab workspace

    Pillar one of four. An AI coding agent is useful because it acts on its own -
    which is exactly why it needs a boundary. Here you put the agent inside an
    sbx microVM and watch the blast radius collapse: the host filesystem, your
    secrets, and the host Docker engine all fall out of reach, credentials are
    brokered by a proxy, and the classic container escape is contained.

    Everything is scripted - no real sbx, Docker, or network - so every learner
    sees the same result.
  product-catalog-demo-showcase/package.json: |
    {
      "name": "product-catalog",
      "version": "1.0.0",
      "scripts": { "start": "node src/index.js" }
    }

sections:
  - title: "The Blast Radius"
    contentPath: 00-blast-radius.md
  - title: "Box the Agent"
    contentPath: 01-box-the-agent.md
  - title: "Credentials Stay Outside"
    contentPath: 02-credentials-outside.md
  - title: "Try the Escape"
    contentPath: 03-try-the-escape.md

variables:
  org: your-org
