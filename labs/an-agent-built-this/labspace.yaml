  - title: "An Agent Containerises It"
    contentPath: 02-agent-containerises.md
  - title: "The Same Agent, On Your Host"
    contentPath: 03-agent-on-the-host.md
  - title: "What Can Go Wrong"
    contentPath: 04-what-can-go-wrong.md
  - title: "Why Not a Container?"
    contentPath: 05-why-not-a-container.md
  - title: "Box the Agent"
