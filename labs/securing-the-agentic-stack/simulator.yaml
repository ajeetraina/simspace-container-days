version: "2.0"

metadata:
  id: securing-the-agentic-stack
  title: "Choice"
  summary: >
    A locked-down sandbox still has to be useful. Register the Docker Hardened
    Images (DHI) MCP server as a kit, attach it to the sandbox, authorize it, and
    watch the boxed agent query the DHI catalog before it picks a base - building a
    0-CVE image. All simulated with real sbx commands (mcp add/inspect/ls/auth,
    run --static-mcp).

# `mcp.added` flips once the DHI MCP server is registered; `mcp.authorized` once
# it is authorized through the control plane.
state:
  org: "your-org"
  kit:
    attached: false # GitGuardian mixin kit attached to the sandbox
  mcp:
    added: false
    authorized: false

settings:
  pace:
    boot: 900 # simulated microVM boot
    pull: 700 # simulated layer download
    build: 900 # simulated build step
    scan: 1100 # simulated DHI catalog / CVE lookup

defaults:
  unmatched:
    stderr: ["command not found - this command isn't part of the lab."]
    exit: 1

scenarios:
  - id: sbx-version
    when:
      command: [sbx, version]
    then:
      output:
        - "sbx version: v0.45.1 9d79d90ee4c5d297fb3d36b75384e8cea7a4fbcb"

  # ===========================================================================
  # Section 1-2 - Bring a mixin kit (GitGuardian). Output mirrors real sbx
  # (kit inspect verified live). The kit wires ggshield as the agent's AI hook;
  # asking the agent to hardcode a secret trips the hook (agent-ggshield-block).
  # ===========================================================================
  - id: sbx-kit-inspect
    when:
      command: [sbx, kit, inspect]
    then:
      output:
        - "  Name:           gitguardian"
        - "  Kind:           mixin"
        - "  Schema:         v2"
        - "  Display:        GitGuardian (ggshield) — Claude Code"
        - "  Description:    Installs the GitGuardian CLI (ggshield) with proxy-injected API-key auth for api.gitguardian.com and wires it as a Claude Code AI hook, so the agent's own actions are scanned for hardcoded secrets automatically - the real key never enters the sandbox."
        - ""
        - "  Policies:"
        - "    Network:      4 allow, 0 deny"
        - "    Credentials:  1 sources"
        - "    Environment:  1 variables, 0 proxy-managed"
        - "    Commands:     2 install, 0 startup, 0 init files"

  - id: sbx-run-kit
    when:
      command: [sbx, run, claude]
      args: { --kit: { any: true } }
    then:
      state: { kit.attached: true }
      output:
        - { text: "Creating sandbox 'demo' (agent: claude)...", delay: boot }
        - "  mixin kit: gitguardian  (pinned by digest)"
        - { text: "  → installing ggshield 1.53.0 (pinned release, SHA256-verified)...", delay: pull }
        - "  → wiring ggshield as the Claude Code AI hook (~/.claude/settings.json)"
        - "  → GITGUARDIAN_API_KEY: proxy-managed placeholder (real key stays on the host)"
        - ""
        - "✓ The GitGuardian kit is in the box. The agent's own actions are now scanned for"
        - "  secrets. Ask it to hardcode a key and watch the hook refuse."

  - id: sbx-exec-ggshield
    when:
      command: [sbx, exec, demo, ggshield]
    then:
      output:
        - { text: "Scanning the workspace... (api.gitguardian.com - key injected by the proxy)", delay: scan }
        - ""
        - "  .env: 2 incidents detected"
        - "    >> AWS Keys (High)"
        - "       8 | AWS_ACCESS_KEY_ID=AKIA..."
        - "       9 | AWS_SECRET_ACCESS_KEY=wJal..."
        - ""
        - "2 incidents found. ggshield caught real keys sitting in the tree - independent of"
        - "whether any agent was careful. The scanner ran inside the box; its API key was"
        - "injected by the proxy on the wire and never entered the sandbox."

  # ===========================================================================
  # Section 2 - Register the DHI MCP server. Positional 0 = name, --url = URL.
  # ===========================================================================
  - id: sbx-mcp-add
    when:
      command: [sbx, mcp, add]
      args: { 0: { any: true }, --url: { any: true } }
    then:
      state: { mcp.added: true }
      output:
        - "Added MCP server '{{ args.0 }}' (remote) -> {{ args.url }}"
        - "  transport: streamable-http"
        - "  its tools are available to agents in the sandbox, governed by your MCP policy."
        - ""
        - "It's registered, not yet attached. Authorize it, then run with --static-mcp."

  - id: sbx-mcp-inspect
    when:
      command: [sbx, mcp, inspect]
      args: { 0: { any: true } }
    then:
      output:
        - "Name:      {{ args.0 }}"
        - "Type:      remote"
        - "URL:       https://dhi.io/mcp"
        - "Transport: streamable-http"
        - "Tools:     dhi_list_repositories, dhi_get_tag_definition,"
        - "           dhi_get_image_cves, dhi_get_image_attestations"

  - id: sbx-mcp-ls-added
    when:
      command: [sbx, mcp, ls]
      state: { mcp.added: true }
    then:
      output:
        - "NAME        TYPE     URL"
        - "remotedhi   remote   https://dhi.io/mcp"
        - ""
        - "1 MCP server configured."

  - id: sbx-mcp-ls
    when:
      command: [sbx, mcp, ls]
    then:
      output:
        - "No MCP servers configured. Add one with: sbx mcp add <name> --url <url>"

  # ===========================================================================
  # Section 3 - Attach and authorize. `auth status` first (more specific), then
  # `auth <server>`.
  # ===========================================================================
  - id: sbx-mcp-auth-status-authed
    when:
      command: [sbx, mcp, auth, status]
      state: { mcp.authorized: true }
    then:
      output:
        - "SERVER      STATUS        VIA"
        - "remotedhi   authorized    hosted MCP control plane (OAuth)"

  - id: sbx-mcp-auth-status
    when:
      command: [sbx, mcp, auth, status]
    then:
      output:
        - "SERVER      STATUS           VIA"
        - "remotedhi   not authorized   run: sbx mcp auth remotedhi"

  - id: sbx-mcp-auth
    when:
      command: [sbx, mcp, auth]
      args: { 0: { any: true } }
    then:
      state: { mcp.authorized: true }
      output:
        - { text: "Authorizing '{{ args.0 }}' through the hosted MCP control plane...", delay: scan }
        - "  OAuth complete. The credential is held centrally - never written into the sandbox."
        - ""
        - "Authorized. Attach it to a sandbox with: sbx run claude --static-mcp remotedhi"

  # ===========================================================================
  # Section 4 - The agent uses DHI. A containerise prompt makes it query the
  # catalog before writing FROM. The -p match precedes the plain run.
  # ===========================================================================
  # MCP into the RUNNING box. The box already exists (created with the kit), so we
  # hot-load the DHI server into it - no restart. (--static-mcp is create-time only
  # and can't be changed on re-attach, so for an existing sandbox you use load.)
  - id: sbx-mcp-load
    when:
      command: [sbx, mcp, load]
    then:
      output:
        - { text: "Loading 'remotedhi' into running sandbox 'demo'...", delay: scan }
        - "  ✓ attached to the sandbox's MCP gateway"
        - "  the agent sees the new tools immediately (tools/list_changed) - no restart."
        - ""
        - "The boxed agent can now query DHI. Ask it to containerise with a hardened base."

  - id: sbx-run
    when:
      command: [sbx, run, claude]
    then:
      output:
        - { text: "Re-attaching to sandbox 'demo'...", delay: boot }
        - ""
        - "The box already exists, with the GitGuardian kit in it. Load the DHI MCP server"
        - "with `sbx mcp load remotedhi --sandbox demo`, then ask the agent to containerise."

  # ===========================================================================
  # Agent sessions + filler.
  # ===========================================================================
  - id: claude-session
    when:
      command: [claude]
    then:
      session:
        prompt: "claude> "
        intro:
          - "Claude Code ready. Enter a task, or type /exit to leave."
        outro:
          - "Claude session ended."

  # HONEST: asked to hardcode a secret, a current agent REFUSES on its own. The
  # kit isn't a backstop for the agent being careless - it's enforcement for when
  # a secret slips through anyway (injection, a different/older agent, a paste).
  - id: agent-refuse-hardcode
    when:
      agent: true
      promptContains: [hardcode]
    then:
      output:
        - "● I won't do that. Hardcoding AWS keys into source is a serious security problem,"
        - "  not a fix: they'd land in git history (effectively permanent), build artifacts,"
        - "  and every clone, and long-lived keys in reachable code are hard to rotate."
        - ""
        - "  Better: keep the proxy, use the AWS credential chain (env / profile / IAM role),"
        - "  or hand out S3 presigned URLs so no long-lived key ever enters the code."
        - ""
        - "  (Good instinct from the agent - but that's its judgment, not a guarantee.)"

  # The boxed agent, with DHI MCP loaded, queries the catalog before writing FROM.
  - id: agent-dhi-build
    when:
      agent: true
      promptContains: [hardened]
    then:
      files:
        - create: Dockerfile
          content: |
            # syntax=docker/dockerfile:1
            FROM dhi.io/node:24-debian13-dev AS build
            WORKDIR /usr/local/app
            COPY package*.json ./
            RUN npm ci --omit=dev

            FROM dhi.io/node:24-debian13 AS final
            ENV NODE_ENV=production
            WORKDIR /usr/local/app
            COPY --from=build /usr/local/app/node_modules ./node_modules
            COPY ./src ./src
            EXPOSE 3000
            CMD ["node", "src/index.js"]
      output:
        - "● Reading the project... Node.js service. Before I choose a base, I'll ask DHI."
        - { text: "  -> remotedhi__dhi_list_repositories { query: \"node\" }", delay: scan }
        - { text: "     ✓ dhi.io/node - hardened Node.js (distroless runtime + -dev build variant)", delay: pull }
        - { text: "  -> remotedhi__dhi_get_image_cves { image: \"dhi.io/node:24-debian13\" }", delay: scan }
        - { text: "     ✓ 0 critical · 0 high · 0 medium · 0 low", delay: pull }
        - { text: "  -> remotedhi__dhi_get_image_attestations { image: \"dhi.io/node:24-debian13\" }", delay: pull }
        - { text: "     ✓ SBOM + SLSA provenance + VEX, signed by Docker, Inc.", delay: pull }
        - ""
        - "● The catalog answered before I wrote a line. Building multi-stage on the hardened base..."
        - { text: "  [+] Building 9.0s FROM dhi.io/node:24-debian13 (distroless)", delay: build }
        - { text: "  => naming to docker.io/library/product-catalog:dhi", delay: build }
        - "● Wrote Dockerfile and built product-catalog:dhi. Same prompt as the ungoverned run -"
        - "  but on a hardened base. `cat Dockerfile` to read it, then scan it with Docker Scout."

  # Prove the payoff with the SAME tool used in Contain: docker scout quickview.
  - id: docker-scout-quickview-dhi
    when:
      command: [docker, scout, quickview]
    then:
      output:
        - { text: "    ✓ Indexed 211 packages", delay: scan }
        - ""
        - "  Target             │  product-catalog:dhi      │    0C     0H     0M     0L"
        - "    digest           │  a7f3c1d9e204             │"
        - "  Base image         │  dhi.io/node:24-debian13  │    0C     0H     0M     0L"
        - ""
        - "Zero across the board. In Contain the same scan on node:20 read 2C / 12H / 20M / 13L"
        - "over 431 packages; here it's 0 / 0 / 0 / 0 over 211. Same tool, same prompt - the"
        - "DHI server in the box changed the outcome."

  - id: agent-fallback
    when:
      agent: true
    then:
      output:
        - "● With the DHI kit attached I can query the catalog. Ask me to containerise the"
        - "  service and I'll pick a hardened, 0-CVE base."

  - id: cd
    when:
      command: [cd]
    then:
      output:
        - "Note: this simulated terminal has no working directory - every command runs from the lab root."

  - id: sbx-mcp-generic
    when:
      command: [sbx, mcp]
    then:
      output:
        - "sbx mcp manages the tool servers your agent can use. Try `sbx mcp add <name>"
        - "  --url <url>`, `sbx mcp ls`, `sbx mcp auth <name>`, or `sbx mcp inspect <name>`."
