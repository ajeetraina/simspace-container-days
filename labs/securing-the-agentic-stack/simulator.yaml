version: "2.0"

metadata:
  id: securing-the-agentic-stack
  title: "Choice"
  summary: >
    A locked-down sandbox still has to be useful. Register the Docker Hardened
    Images (DHI) MCP server as a kit, attach it to the sandbox, authorize it, and
    watch the boxed agent query the DHI catalog before it picks a base - building a
    0-CVE image. All simulated with real sbx commands (mcp add/inspect/ls/auth,
    run --static-mcp).

# `mcp.added` flips once the DHI MCP server is registered; `mcp.authorized` once
# it is authorized through the control plane.
state:
  org: "your-org"
  mcp:
    added: false
    authorized: false

settings:
  pace:
    boot: 900 # simulated microVM boot
    pull: 700 # simulated layer download
    build: 900 # simulated build step
    scan: 1100 # simulated DHI catalog / CVE lookup

defaults:
  unmatched:
    stderr: ["command not found - this command isn't part of the lab."]
    exit: 1

scenarios:
  - id: sbx-version
    when:
      command: [sbx, version]
    then:
      output:
        - "Docker Sandboxes (sbx) 0.12.0"
        - "sandboxd: running"

  # ===========================================================================
  # Section 2 - Register the DHI MCP server. Positional 0 = name, --url = URL.
  # ===========================================================================
  - id: sbx-mcp-add
    when:
      command: [sbx, mcp, add]
      args: { 0: { any: true }, --url: { any: true } }
    then:
      state: { mcp.added: true }
      output:
        - "Added MCP server '{{ args.0 }}' (remote) -> {{ args.url }}"
        - "  transport: streamable-http"
        - "  its tools are available to agents in the sandbox, governed by your MCP policy."
        - ""
        - "It's registered, not yet attached. Authorize it, then run with --static-mcp."

  - id: sbx-mcp-inspect
    when:
      command: [sbx, mcp, inspect]
      args: { 0: { any: true } }
    then:
      output:
        - "Name:      {{ args.0 }}"
        - "Type:      remote"
        - "URL:       https://dhi.io/mcp"
        - "Transport: streamable-http"
        - "Tools:     dhi_list_repositories, dhi_get_tag_definition,"
        - "           dhi_get_image_cves, dhi_get_image_attestations"

  - id: sbx-mcp-ls-added
    when:
      command: [sbx, mcp, ls]
      state: { mcp.added: true }
    then:
      output:
        - "NAME        TYPE     URL"
        - "remotedhi   remote   https://dhi.io/mcp"
        - ""
        - "1 MCP server configured."

  - id: sbx-mcp-ls
    when:
      command: [sbx, mcp, ls]
    then:
      output:
        - "No MCP servers configured. Add one with: sbx mcp add <name> --url <url>"

  # ===========================================================================
  # Section 3 - Attach and authorize. `auth status` first (more specific), then
  # `auth <server>`.
  # ===========================================================================
  - id: sbx-mcp-auth-status-authed
    when:
      command: [sbx, mcp, auth, status]
      state: { mcp.authorized: true }
    then:
      output:
        - "SERVER      STATUS        VIA"
        - "remotedhi   authorized    hosted MCP control plane (OAuth)"

  - id: sbx-mcp-auth-status
    when:
      command: [sbx, mcp, auth, status]
    then:
      output:
        - "SERVER      STATUS           VIA"
        - "remotedhi   not authorized   run: sbx mcp auth remotedhi"

  - id: sbx-mcp-auth
    when:
      command: [sbx, mcp, auth]
      args: { 0: { any: true } }
    then:
      state: { mcp.authorized: true }
      output:
        - { text: "Authorizing '{{ args.0 }}' through the hosted MCP control plane...", delay: scan }
        - "  OAuth complete. The credential is held centrally - never written into the sandbox."
        - ""
        - "Authorized. Attach it to a sandbox with: sbx run claude --static-mcp remotedhi"

  # ===========================================================================
  # Section 4 - The agent uses DHI. A containerise prompt makes it query the
  # catalog before writing FROM. The -p match precedes the plain run.
  # ===========================================================================
  - id: sbx-run-dhi-build
    when:
      command: [sbx, run, claude]
      args: { -p: { any: true } }
    then:
      files:
        - create: Dockerfile
          content: |
            # syntax=docker/dockerfile:1
            FROM dhi.io/node:24-debian13-dev AS build
            WORKDIR /usr/local/app
            COPY package*.json ./
            RUN npm ci --omit=dev

            FROM dhi.io/node:24-debian13 AS final
            ENV NODE_ENV=production
            WORKDIR /usr/local/app
            COPY --from=build /usr/local/app/node_modules ./node_modules
            COPY ./src ./src
            EXPOSE 3000
            CMD ["node", "src/index.js"]
      output:
        - { text: "Creating sandbox 'demo' (agent: claude, static MCP: remotedhi)...", delay: boot }
        - "● Reading the project... Node.js service. Before I choose a base, I'll ask DHI."
        - { text: "  -> remotedhi__dhi_list_repositories { query: \"node\" }", delay: scan }
        - { text: "     ✓ dhi.io/node - hardened Node.js (distroless runtime + -dev build variant)", delay: pull }
        - { text: "  -> remotedhi__dhi_get_image_cves { image: \"dhi.io/node:24-debian13\" }", delay: scan }
        - { text: "     ✓ 0 critical · 0 high · 0 medium · 0 low", delay: pull }
        - { text: "  -> remotedhi__dhi_get_image_attestations { image: \"dhi.io/node:24-debian13\" }", delay: pull }
        - { text: "     ✓ SBOM + SLSA provenance + VEX, signed by Docker, Inc.", delay: pull }
        - ""
        - "● The catalog answered before I wrote a line. Building multi-stage on the hardened base..."
        - { text: "  [+] Building 9.0s FROM dhi.io/node:24-debian13 (distroless)", delay: build }
        - "● Wrote Dockerfile. Same prompt as the ungoverned run - but the agent chose a"
        - "  0-CVE, signed base, because the DHI kit was in the box. `cat Dockerfile` to see it."

  - id: sbx-run-static
    when:
      command: [sbx, run, claude]
      args: { --static-mcp: { any: true } }
    then:
      output:
        - { text: "Creating sandbox 'demo' (agent: claude)...", delay: boot }
        - "  static MCP set: remotedhi  (discovery off - the agent can use only this)"
        - ""
        - "✓ The DHI kit is attached. Ask the agent to containerise the service and it will"
        - "  query the catalog first - try `sbx run claude --static-mcp remotedhi -p \"...\"`."

  - id: sbx-run
    when:
      command: [sbx, run, claude]
    then:
      output:
        - { text: "Creating sandbox 'demo' (agent: claude)...", delay: boot }
        - ""
        - "No MCP kit attached - the agent has no catalog to ask. Attach the DHI server"
        - "with `--static-mcp remotedhi` so it can choose a hardened base."

  # ===========================================================================
  # Agent sessions + filler.
  # ===========================================================================
  - id: claude-session
    when:
      command: [claude]
    then:
      session:
        prompt: "claude> "
        intro:
          - "Claude Code ready. Enter a task, or type /exit to leave."
        outro:
          - "Claude session ended."

  - id: agent-fallback
    when:
      agent: true
    then:
      output:
        - "● With the DHI kit attached I can query the catalog. Ask me to containerise the"
        - "  service and I'll pick a hardened, 0-CVE base."

  - id: cd
    when:
      command: [cd]
    then:
      output:
        - "Note: this simulated terminal has no working directory - every command runs from the lab root."

  - id: sbx-mcp-generic
    when:
      command: [sbx, mcp]
    then:
      output:
        - "sbx mcp manages the tool servers your agent can use. Try `sbx mcp add <name>"
        - "  --url <url>`, `sbx mcp ls`, `sbx mcp auth <name>`, or `sbx mcp inspect <name>`."
