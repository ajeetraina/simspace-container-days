version: "2.0"

metadata:
  id: find-vulnerabilities
  title: "Control"
  summary: >
    Decide what the boxed agent can reach. Inspect the active policy, check an
    endpoint before you run, add allow and deny rules, and read the policy log.
    All simulated with real sbx commands (policy ls/profile/check/allow/deny/log).

# `net.inventoryAllowed` flips to true once an allow rule is added for the
# internal inventory service.
state:
  org: "your-org"
  net:
    inventoryAllowed: false

settings:
  pace:
    boot: 900
    check: 400

defaults:
  unmatched:
    stderr: ["command not found - this command isn't part of the lab."]
    exit: 1

scenarios:
  - id: sbx-version
    when:
      command: [sbx, version]
    then:
      output:
        - "Docker Sandboxes (sbx) 0.12.0"
        - "sandboxd: running"

  - id: sbx-run
    when:
      command: [sbx, run, claude]
    then:
      output:
        - { text: "Creating sandbox 'demo' (agent: claude)...", delay: boot }
        - "  microVM booted. Network: every outbound request passes through the proxy,"
        - "  which allows or blocks it against your policy."
        - ""
        - "✓ Sandbox 'demo' running. Inspect the policy with `sbx policy ls`."

  # ===========================================================================
  # Section 1 - What the agent can reach. Profiles + the active policy.
  # ===========================================================================
  - id: sbx-policy-profile-ls
    when:
      command: [sbx, policy, profile, ls]
    then:
      output:
        - "PROFILE       SOURCE       DESCRIPTION"
        - "locked-down   governance   only what you explicitly allow"
        - "balanced      governance   common dev endpoints allowed, everything else denied  (default)"
        - "open          governance   outbound allowed, still logged"
        - ""
        - "Pick one at create time: sbx run claude --profile locked-down"

  - id: sbx-policy-ls
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "POLICY    SOURCE   APPLIES TO   SUMMARY"
        - "global    local    all          allow: llm + common dev endpoints · deny: everything else"
        - ""
        - "Default posture is balanced: the agent can reach api.anthropic.com and"
        - "registry.npmjs.org, but anything else is denied and logged. Tighten or"
        - "loosen it with `sbx policy allow network` / `sbx policy deny network`."

  # ===========================================================================
  # Section 2 - Check an endpoint before you run (read-only).
  # ===========================================================================
  - id: sbx-policy-check-allowed
    when:
      command: [sbx, policy, check, network]
      state: { net.inventoryAllowed: true }
    then:
      output:
        - { text: "Evaluating against the active policy...", delay: check }
        - "  inventory.internal:8080   ALLOW   (rule: allow inventory.internal)"
        - ""
        - "Now permitted - your allow rule matched. The check is read-only; it runs the"
        - "same authorizer the proxy uses at request time."

  - id: sbx-policy-check
    when:
      command: [sbx, policy, check, network]
    then:
      output:
        - { text: "Evaluating against the active policy...", delay: check }
        - "  inventory.internal:8080   DENY   (no matching allow rule, balanced default)"
        - ""
        - "Denied by default. The agent would be blocked reaching your internal service -"
        - "nothing breaks, the connection is just refused and logged. Decide: allow it or not."

  # ===========================================================================
  # Section 3 - Allow and deny rules.
  # ===========================================================================
  - id: sbx-policy-allow
    when:
      command: [sbx, policy, allow, network]
    then:
      state: { net.inventoryAllowed: true }
      output:
        - "Added allow rule (global): inventory.internal  (TCP)"
        - ""
        - "The next run can reach it. Everything still-unlisted stays denied and logged."
        - "Re-check with `sbx policy check network inventory.internal:8080`."

  - id: sbx-policy-deny
    when:
      command: [sbx, policy, deny, network]
    then:
      output:
        - "Added deny rule (global): telemetry.vendor.example  (TCP)"
        - ""
        - "Deny takes precedence over allow. Even if a broad allow rule would match,"
        - "this host is now blocked - a simple way to stop known exfiltration targets."

  # ===========================================================================
  # Section 4 - The policy log.
  # ===========================================================================
  - id: sbx-policy-log
    when:
      command: [sbx, policy, log]
    then:
      output:
        - "SANDBOX   HOST                        RULE                         PROXY   DECISION   COUNT"
        - "demo      api.anthropic.com           allow default (llm)          https   allowed    5"
        - "demo      registry.npmjs.org          allow default (dev)          https   allowed    2"
        - "demo      inventory.internal:8080     deny default                 tcp     blocked    4"
        - "demo      inventory.internal:8080     allow inventory.internal     tcp     allowed    1"
        - "demo      telemetry.vendor.example    deny telemetry.vendor        https   blocked    3"
        - ""
        - "Every connection the agent tried - allowed or blocked, with the rule that"
        - "decided it and how many times. This is how you see what it actually reached."

  # ===========================================================================
  # Agent sessions + filler.
  # ===========================================================================
  - id: claude-session
    when:
      command: [claude]
    then:
      session:
        prompt: "claude> "
        intro:
          - "Claude Code ready. Enter a task, or type /exit to leave."
        outro:
          - "Claude session ended."

  - id: agent-fallback
    when:
      agent: true
    then:
      output:
        - "● I run behind the proxy. Try `sbx policy check network inventory.internal:8080`,"
        - "  then `sbx policy allow network inventory.internal`, then check again."

  - id: cd
    when:
      command: [cd]
    then:
      output:
        - "Note: this simulated terminal has no working directory - every command runs from the lab root."

  - id: sbx-policy-generic
    when:
      command: [sbx, policy]
    then:
      output:
        - "sbx policy manages what sandboxes can reach. Try: `sbx policy ls`,"
        - "  `sbx policy check network <host>`, `sbx policy allow network <host>`,"
        - "  `sbx policy deny network <host>`, or `sbx policy log`."
