# Seed the already-containerised app: the agent from Lab 1 left a best-practice
# Dockerfile on the node:20 base and a built image. Learners jump straight to
# scanning. The Dockerfile is rewritten to a DHI base later in the lab.
files:
  README.md: |
    # Find the Vulnerabilities - lab workspace

    Picking up where "An Agent Built This" left off: the agent containerised the
    Product Catalog and left a best-practice, multi-stage Dockerfile - on the fat
    node:20 base. The image product-catalog:latest is built and ready to scan.

    Everything here is scripted - no real Docker or network - so every learner
    sees the same CVE counts.
  product-catalog-demo-showcase/package.json: |
    {
      "name": "container-supported-development",
      "version": "1.0.0",
      "scripts": {
        "start": "node src/index.js"
      },
      "dependencies": {
        "@aws-sdk/client-s3": "^3.1030.0",
        "dotenv": "^17.4.2",
        "express": "^5.2.1",
        "kafkajs": "^2.2.4",
        "multer": "^2.1.1",
        "node-fetch": "^2",
        "pg": "^8.20.0"
      }
    }
  product-catalog-demo-showcase/Dockerfile: |
    # Generated by an AI agent - best-practice multi-stage build.
    # syntax=docker/dockerfile:1

    FROM node:20 AS build
    WORKDIR /usr/src/app
    COPY package*.json ./
    RUN npm ci --omit=dev
    COPY src ./src

    FROM node:20 AS final
    ENV NODE_ENV=production
    WORKDIR /usr/src/app
    RUN useradd --system --uid 10001 appuser
    COPY --from=build /usr/src/app/node_modules ./node_modules
    COPY --from=build /usr/src/app/src ./src
    COPY package.json ./
    USER appuser
    EXPOSE 3000
    CMD ["node", "src/index.js"]

