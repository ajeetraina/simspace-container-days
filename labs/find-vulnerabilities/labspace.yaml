title: "Control"
description: >
  Decide what the boxed agent is allowed to reach. Pick a network policy profile,
  add allow and deny rules on top, and read the policy log to see exactly what the
  agent tried to connect to - and what the boundary stopped. Fully simulated;
  nothing to install.

catalog:
  icon: policy
  description: "Decide what the agent can reach: pick a network policy profile, add allow/deny rules, and read the policy log."
  tags: ["sandbox", "network policy", "allow-deny", "governance", "audit", "control"]
  estimatedMinutes: 20
  order: 3

simulator: simulator.yaml

terminals:
  - id: host
    title: Terminal
    icon: terminal

files:
  README.md: |
    # Control - lab workspace

    Pillar two of four. Containment is always on; Control is what you tune. The
    agent is already boxed - now you decide which network endpoints it may reach.
    Pick a profile, add allow/deny rules, and read the policy log to see exactly
    what it tried.

    Everything is scripted - no real sbx or network - so every learner sees the
    same result.
  product-catalog-demo-showcase/package.json: |
    {
      "name": "product-catalog",
      "version": "1.0.0",
      "scripts": { "start": "node src/index.js" }
    }

sections:
  - title: "You Can't Govern What You Can't See"
    contentPath: 00-whats-inside.md
  - title: "Scan It with Docker Scout"
    contentPath: 01-scan-with-scout.md
  - title: "Docker Hardened Images (DHI)"
    contentPath: 02-hardened-images.md
  - title: "Re-scan: The Collapse"
    contentPath: 03-rescan.md
  - title: "Enforce It: The Policy Gate"
    contentPath: 04-enforce-the-gate.md

variables:
  org: your-org
