title: "Coordinate"
description: >
  One secured agent can do a task. A software factory is a team: a coordinator
  that assigns work from a backlog, a developer that edits and commits, and a
  reviewer that checks the result against the task and your coding policy - all
  running inside the one sandbox you secured and made reproducible. When the team
  hits a product decision, it stops and asks you. Fully simulated; nothing to
  install.

# Landing-page card. Only shown when the repo has two or more labs. labs.json is
# GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: hub
  description: "Run a team of agents - coordinator, developer, reviewer - inside the secured, reproducible sandbox, driven by a task backlog, pausing to ask you when a human decision is needed."
  tags: ["sandbox", "sbx", "agents", "team", "coordinate", "backlog", "human-in-the-loop"]
  estimatedMinutes: 20
  order: 6

simulator: simulator.yaml

terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the project, the shared sbxenv.yaml from Capacity (now with a team block),
# and a small task backlog the coordinator pulls from.
files:
  README.md: |
    # Coordinate - lab workspace

    You secured one sandbox across the earlier Cs - Contain (an isolated microVM),
    Control (a network policy), Choice (the MCP tools) - and Capacity made it
    reproducible for the whole team. Coordinate is what turns that one sandbox into
    a software factory: a team of agents working the same project, the same way.

    In this lab a coordinator pulls a task from the backlog, hands it to a
    developer, a reviewer checks the result against the task and the coding policy,
    and the team pauses to ask you when a product decision is needed.

    Everything here is scripted - no real sbx, agents, or network - so every
    learner gets the same result.
  sbxenv.yaml: |
    # sbxenv.yaml - the team's sandbox from Capacity, now with a team block.
    schemaVersion: "1"
    name: product-catalog
    agent: claude
    workspace: .
    kits:
      # the DHI pinning kit from Choice: registers the DHI MCP, steers to dhi.io,
      # and denies 3rd-party registries at the network edge
      - git+https://github.com/ajeetraina/docker-cloud-sandboxes-demo.git#dir=agent-cli/codex-dhi/dhi-mixin
    secrets:
      dhi-mcp-pat:
        ref: "op://Engineering/DockerHub/pat"
        snapshot: true
    # The team: three roles, each a session inside THIS sandbox. Provider and model
    # are chosen per role - here all Claude, but a reviewer could be a different model.
    team:
      coordinator: { agent: claude, model: opus }
      developer:   { agent: claude, model: sonnet }
      reviewer:    { agent: claude, model: sonnet }
      backlog: ./backlog   # where the coordinator reads tasks and writes results
  backlog/WAD-104-service-column.md: |
    # WAD-104 - Add a service column and filter

    Status: todo

    The incident board lists incidents but you can't see or filter by the service
    each one belongs to. Add a "Service" column to the board and a filter that
    narrows the list to one service.

    Acceptance:
    - A Service column appears on the board.
    - A filter control narrows incidents to a selected service.
    - Existing tests still pass.
  product-catalog-demo-showcase/package.json: |
    {
      "name": "product-catalog",
      "version": "1.0.0",
      "scripts": { "start": "node src/index.js", "test": "node --test" }
    }

sections:
  - title: "One Agent Isn't a Team"
    contentPath: 00-one-agent-isnt-a-team.md
  - title: "Assign From the Backlog"
    contentPath: 01-assign-from-the-backlog.md
  - title: "Develop, Then Review"
    contentPath: 02-develop-and-review.md
  - title: "Ask the Human"
    contentPath: 03-ask-the-human.md

variables:
  org: your-org
