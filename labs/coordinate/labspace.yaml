title: "Coordinate"
description: >
  One agent is one pair of hands. A software factory needs more than one role -
  a developer that writes, a reviewer that checks - working the same project.
  sbx runs one agent per sandbox, so a team is several sandboxes over one shared
  workspace, each boxed by the same policy you set in the earlier Cs. sbx gives
  every role the same secured box; coordinating them - and owning the product
  decision - is still your job. Fully simulated; nothing to install.

# Landing-page card. Only shown when the repo has two or more labs. labs.json is
# GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: hub
  description: "Run more than one agent over the same project with real sbx - a developer and a reviewer, each in its own secured sandbox - and stay the coordinator who makes the product call."
  tags: ["sandbox", "sbx", "agents", "team", "coordinate", "exec", "human-in-the-loop"]
  estimatedMinutes: 20
  order: 6

simulator: simulator.yaml

terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the project, the secured sbxenv.yaml from Capacity, and a plain task file
# the developer will implement. The "backlog" here is just a file you cat - sbx
# has no task tracker of its own.
files:
  README.md: |
    # Coordinate - lab workspace

    You secured one sandbox across the earlier Cs - Contain (an isolated microVM),
    Control (a network policy), Choice (the MCP tools) - and Capacity made it
    reproducible for the whole team. Coordinate is what turns that one box into a
    factory: more than one agent working the same project at once.

    sbx runs one agent per sandbox. So a "team" is several sandboxes over the same
    shared workspace - a developer and a reviewer here - each boxed by the same
    policy. You create them with `sbx create`, give each work with `sbx exec`, and
    stay the one who makes the product call. sbx isolates the agents; it does not
    orchestrate them for you.

    Everything here is scripted - no real sbx, agents, or network - so every
    learner gets the same result.
  sbxenv.yaml: |
    # sbxenv.yaml - the secured single-agent box from Capacity. Each role sandbox
    # you create reuses the same agent, kit, and policy baseline.
    schemaVersion: "1"
    name: product-catalog
    agent: claude
    workspace: .
    kits:
      - git+https://github.com/ajeetraina/docker-cloud-sandboxes-demo.git#dir=agent-cli/codex-dhi/dhi-mixin
    secrets:
      dhi-mcp-pat:
        ref: "op://Engineering/DockerHub/pat"
        snapshot: true
  backlog/CAT-12-category-filter.md: |
    # CAT-12 - Add a category filter to the product list

    Status: todo

    The product list shows every product but you can't narrow it by category.
    Add a category filter that narrows the list to one category.

    Acceptance:
    - A filter control narrows the product list to a selected category.
    - Existing tests still pass.
  product-catalog-demo-showcase/package.json: |
    {
      "name": "product-catalog",
      "version": "1.0.0",
      "scripts": { "start": "node src/index.js", "test": "node --test" }
    }

sections:
  - title: "One Box Isn't a Factory"
    contentPath: 00-one-box-isnt-a-factory.md
  - title: "Stand Up the Roles"
    contentPath: 01-stand-up-the-roles.md
  - title: "Give Each Role Work"
    contentPath: 02-give-each-role-work.md
  - title: "You Are the Coordinator"
    contentPath: 03-you-are-the-coordinator.md

variables:
  org: your-org
